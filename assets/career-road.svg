<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" role="img" aria-label="Career timeline as a road: KopTup 2020, Tata Consultancy Services 2021 and 2023, SoftMas 2024, Globa 2025 and Flimp 2025 to today."><title>Career timeline as a road: KopTup 2020, Tata Consultancy Services 2021 and 2023, SoftMas 2024, Globa 2025 and Flimp 2025 to today.</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#e8ebf1}
.m{fill:#8b95a7}
.w{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.go{animation:go 18s cubic-bezier(.4,0,.6,1) infinite}
.dash{animation:dsh .6s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-40}}
.smoke{transform-box:fill-box;transform-origin:center;animation:sm 1.1s ease-out infinite}
@keyframes sm{0%{transform:translate(0,0) scale(.5);opacity:.5}100%{transform:translate(-26px,-10px) scale(1.6);opacity:0}}
.beam{animation:bm 0.9231s ease-in-out infinite}
@keyframes bm{50%{opacity:.34}}
.now{transform-box:fill-box;transform-origin:center;animation:nw 0.9231s ease-out infinite}
@keyframes nw{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes go{0.00%,4.00%{transform:translateX(18px)}16.67%,20.67%{transform:translateX(166px)}33.33%,37.33%{transform:translateX(314px)}50.00%,54.00%{transform:translateX(462px)}66.67%,70.67%{transform:translateX(610px)}83.33%,87.33%{transform:translateX(758px)}95.00%{transform:translateX(758px);opacity:1}100%{transform:translateX(758px);opacity:0}}@keyframes p0{0%,0.00%{fill:#2a3242}0.50%,94%{fill:#e05cd6}100%{fill:#2a3242}}
@keyframes p1{0%,16.17%{fill:#2a3242}17.17%,94%{fill:#e05cd6}100%{fill:#2a3242}}
@keyframes p2{0%,32.83%{fill:#2a3242}33.83%,94%{fill:#e05cd6}100%{fill:#2a3242}}
