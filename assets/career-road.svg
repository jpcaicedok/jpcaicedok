@keyframes p4{0%,66.17%{fill:#2a3242}67.17%,94%{fill:#e05cd6}100%{fill:#2a3242}}
@keyframes p5{0%,82.83%{fill:#2a3242}83.83%,94%{fill:#e05cd6}100%{fill:#2a3242}}
