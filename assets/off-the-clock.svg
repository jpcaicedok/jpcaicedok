<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Three animated panels: a music staff with notes for classical music, a step sequencer at 130 BPM for techno, and a motorcycle on the road."><title>Three animated panels: a music staff with notes for classical music, a step sequencer at 130 BPM for techno, and a motorcycle on the road.</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#e8ebf1}
.m{fill:#8b95a7}
.w{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.scr{animation:scr 14s linear infinite}
@keyframes scr{to{transform:translateX(-280px)}}
.ph{animation:ph 1.8462s steps(16) infinite}
@keyframes ph{to{transform:translateX(240px)}}
.kk{transform-box:fill-box;transform-origin:center;animation:kk 0.4615s ease-out infinite}
@keyframes kk{0%{transform:scale(1.15)}100%{transform:scale(.95)}}
.st{animation:st 1.8462s steps(1) infinite}
.dash{animation:dsh .4s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-36}}
.bob{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(1.6px)}}
.hill{animation:hl 11s linear infinite}
@keyframes hl{to{transform:translateX(-280px)}}
.puff{transform-box:fill-box;transform-origin:center;animation:sm 1s ease-out infinite}
@keyframes sm{0%{transform:translate(0,0) scale(.5);opacity:.6}100%{transform:translate(-34px,-12px) scale(1.8);opacity:0}}
