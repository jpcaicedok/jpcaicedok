<style>
:root{--bg:#0b0e14;--bg2:#121722;--bg3:#1a2130;--line:#2a3242;--ink:#eef0f5;--mute:#a3adbf;--mag:#e05cd6;--amb:#f2b45a;--tea:#46d9c5;--on:#0b0e14;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html[data-theme=light]{--bg:#f6f4ef;--bg2:#fff;--bg3:#ece8df;--line:#cfc9bc;--ink:#14171f;--mute:#4f5868;--mag:#a51f9c;--amb:#8f5a00;--tea:#00756a;--on:#fff}
html[data-contrast=high]{--bg:#000;--bg2:#000;--bg3:#111;--line:#fff;--ink:#fff;--mute:#fff;--mag:#ff8df5;--amb:#ffd27a;--tea:#6ff5e2;--on:#000}
html[data-contrast=high][data-theme=light]{--bg:#fff;--bg2:#fff;--bg3:#eee;--line:#000;--ink:#000;--mute:#000;--mag:#7a0072;--amb:#5c3a00;--tea:#00534b;--on:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
html[data-motion=off]{scroll-behavior:auto}
html[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:1rem;overflow-x:hidden}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tea);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--mag);color:var(--on);padding:8px 14px;border-radius:6px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.label{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mag)}
nav.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{font-family:var(--mono);font-weight:700;text-decoration:none;white-space:nowrap}
.brand i{color:var(--mag);font-style:normal}
.links{display:flex;gap:18px;margin-left:auto;font-size:.9rem}
.links a{text-decoration:none;color:var(--mute)}.links a:hover{color:var(--ink)}
.iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:.8rem;min-height:36px;white-space:nowrap}
.iconbtn:hover{border-color:var(--mag)}
@media(max-width:820px){.links{display:none}.navright{margin-left:auto}}
.navright{display:flex;gap:8px}
/* hero */
.hero{padding:64px 24px 40px;display:grid;grid-template-columns:1.08fr 1fr;gap:40px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding-top:36px}}
h1{font-size:clamp(2.6rem,6.2vw,4.5rem);line-height:1.02;letter-spacing:-.035em;margin:14px 0 12px;font-weight:800}
.typed{font-family:var(--mono);color:var(--tea);font-size:clamp(1rem,2.2vw,1.3rem);min-height:1.7em}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--mag);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lead{font-size:1.12rem;color:var(--ink);max-width:56ch;margin:16px 0 8px}
.lead2{color:var(--mute);max-width:56ch;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);text-decoration:none;font-weight:600;transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-2px);border-color:var(--mag)}
.btn.pri{background:var(--mag);color:var(--on);border-color:var(--mag)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 0}
.facts div{background:var(--bg2);padding:16px}
.facts b{display:block;font-family:var(--mono);font-size:.92rem;line-height:1.35}
.facts span{font-size:.82rem;color:var(--mute)}
@media(max-width:720px){.facts{grid-template-columns:1fr 1fr}}
/* card */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.deck{padding:16px}
.deckhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#viz{display:block;width:100%;height:200px;border-radius:9px;background:var(--bg)}
.xf{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:14px 0 10px;font-family:var(--mono);font-size:.78rem}
.xf .a{color:var(--amb)}.xf .b{color:var(--mag)}
input[type=range]{width:100%;accent-color:var(--mag);min-height:28px}
.deckfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.small{font-size:.82rem;color:var(--mute)}
section{padding:60px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem);letter-spacing:-.025em;line-height:1.12;margin:8px 0 10px}
.sub{color:var(--mute);max-width:62ch;margin:0 0 26px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;white-space:nowrap;min-height:42px;color:var(--mute)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.case{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;padding:24px}
@media(max-width:860px){.case{grid-template-columns:1fr;padding:18px}}
.case h3{margin:6px 0 8px;font-size:1.35rem;letter-spacing:-.01em}
.case ul{margin:10px 0;padding-left:20px}.case li{margin:7px 0}
.badge{display:inline-block;font-family:var(--mono);font-size:.72rem;border:1px solid var(--amb);color:var(--amb);border-radius:999px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--mute);background:transparent}
.demo{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:16px;align-self:start}
.demo h4{margin:0 0 4px;font-size:.98rem}
.note{font-size:.76rem;color:var(--mute);margin:10px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem;gap:8px}
.pill{font-family:var(--mono);font-size:.72rem;border-radius:5px;padding:3px 8px;background:var(--bg3);min-width:96px;text-align:center}
.pill.v2{background:var(--tea);color:var(--on);font-weight:700}
.pill.ok{background:transparent;color:var(--tea);border:1px solid var(--tea)}
.mini{margin-top:12px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--mag);background:transparent;font-weight:600}
.mini:hover{background:var(--mag);color:var(--on)}
.mini[disabled]{opacity:.5;cursor:default;background:transparent;color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 10px}
.seg button{background:transparent;border:0;padding:7px 14px;min-height:38px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--bg3);color:var(--ink);font-weight:700}
.svc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.svc span{font-family:var(--mono);font-size:.82rem;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.svc.after span{border-color:var(--tea)}
.flow{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.flow li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.86rem;margin:0;transition:border-color .2s,background .2s}
.flow li b{font-family:var(--mono);font-size:.78rem;min-width:84px}
.flow li.on{border-color:var(--mag);background:color-mix(in srgb,var(--mag) 12%,transparent)}
.flow li.done{border-color:var(--tea)}
.meter{margin:9px 0;font-size:.82rem}
.meter .bar{height:10px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:3px}
.meter .bar i{display:block;height:100%;background:var(--amb);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.meter span{display:flex;justify-content:space-between;gap:8px}
/* stack */
.stackgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
@media(max-width:860px){.stackgrid{grid-template-columns:1fr}}
.grp{margin-bottom:14px}
.grp .label{color:var(--mute);display:block;margin-bottom:6px;font-size:.7rem}
.tech{font-family:var(--mono);font-size:.82rem;border:1px solid var(--line);background:var(--bg2);border-radius:7px;padding:7px 11px;min-height:38px;margin:0 5px 6px 0;transition:all .12s}
.tech:hover{border-color:var(--mag)}
.tech[aria-pressed=true]{background:var(--mag);border-color:var(--mag);color:var(--on);font-weight:700}
.used{padding:18px;min-height:240px}
.used article{padding:11px 0;border-bottom:1px solid var(--line)}
.used article:last-child{border:0}
.used h4{margin:0;font-size:.98rem}
.used p{margin:2px 0 0;font-size:.85rem;color:var(--mute)}
/* road */
.road{position:relative;height:136px;margin-top:6px;overflow:hidden;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.pin{position:absolute;bottom:46px;width:2px;height:48px;background:var(--line);margin-left:-1px}.pin:before{content:"";position:absolute;top:-5px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .4s}.pin.on:before{background:var(--mag)}
.asphalt{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--bg3);border-top:2px solid var(--line)}
.asphalt:after{content:"";position:absolute;left:0;right:0;top:21px;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 22px,transparent 22px 40px)}
.moto{position:absolute;bottom:18px;width:104px;margin-left:-52px;transition:left 1.1s cubic-bezier(.5,0,.3,1);z-index:2;pointer-events:none}
.w{transform-box:fill-box;transform-origin:center}
.moto.go .w,.rev .w{animation:spin .4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stops{display:grid;grid-template-columns:repeat(6,1fr);margin:10px 0 0;gap:6px}
.stop{background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 4px;min-height:58px;text-align:center;line-height:1.25}
.stop b{display:block;font-size:.86rem}.stop span{font-family:var(--mono);font-size:.7rem;color:var(--mute)}
.stop[aria-current=true]{border-color:var(--mag);background:color-mix(in srgb,var(--mag) 14%,transparent)}
@media(max-width:560px){.stops{grid-template-columns:repeat(3,1fr)}.stop b{font-size:.78rem}.stop span{font-size:.66rem}}
.jobd{padding:20px;margin-top:12px}
.jobd h3{margin:0;font-size:1.2rem}.jobd ul{margin:10px 0 0;padding-left:20px}.jobd li{margin:6px 0}
/* terminal */
.term{font-family:var(--mono);background:#07090d;color:#d9dee8;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.9rem}
html[data-contrast=high] .term{background:#000;color:#fff}
.termbar{display:flex;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid #222a38;font-size:.75rem;color:#8f9bb0}
.termbar i{width:11px;height:11px;border-radius:50%;background:#2d3647;display:block}.termbar i:first-child{background:#e05cd6}.termbar i:nth-child(2){background:#f2b45a}.termbar i:nth-child(3){background:#46d9c5}
#tout{height:320px;overflow:auto;padding:14px;white-space:pre-wrap;word-break:break-word}
#tout .c{color:#46d9c5}#tout .h{color:#f2b45a}#tout .m{color:#e88be2}
.tin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #222a38;align-items:center}
.tin label{color:#e88be2;white-space:nowrap}
.tin input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-family:var(--mono);min-height:30px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sugs button{font-family:var(--mono);font-size:.78rem;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-height:34px}
.sugs button:hover{border-color:var(--tea)}
/* off the clock */
.off{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:960px){.off{grid-template-columns:1fr}}
.tile{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile h3{margin:0;font-size:1.1rem}
.piano{position:relative;flex:1;min-height:150px;display:flex;touch-action:none;user-select:none}
.pk{flex:1;background:#eef0f5;border:1px solid #222;border-radius:0 0 5px 5px;padding:0;min-width:0}
.pk.on,.bk.on{background:var(--mag)}
.bk{position:absolute;top:0;width:8.6%;height:60%;background:#151a24;border:1px solid #000;border-radius:0 0 4px 4px;z-index:2;padding:0}
.seq{display:grid;grid-template-columns:30px repeat(16,1fr);gap:2px;align-items:center}
.seq span{font-family:var(--mono);font-size:.62rem;color:var(--mute)}
.seq button{height:26px;padding:0;border:1px solid var(--line);background:var(--bg3);border-radius:3px;min-width:0}
.seq button[aria-pressed=true]{background:var(--mag);border-color:var(--mag)}
.seq button.b4{border-left-color:var(--mute)}
.seq button.now{outline:2px solid var(--amb);outline-offset:-2px}
.gauge{display:block;width:100%;max-height:120px}
.throttle{min-height:52px;border-radius:9px;background:var(--bg3);border:1px solid var(--tea);font-weight:700;touch-action:none;user-select:none}
.throttle:active,.throttle.on{background:var(--tea);color:var(--on)}
.motobox{position:relative;height:72px}
.motobox svg{position:absolute;left:50%;margin-left:-52px;width:104px;bottom:0}
.rev{animation:shake .08s linear infinite}
@keyframes shake{50%{transform:translateY(1px)}}
footer{border-top:1px solid var(--line);padding:56px 0}
.final{text-align:center}.final h2{margin-bottom:6px}.final .cta{justify-content:center;margin-top:18px}
/* a11y */
#a11y{position:fixed;right:16px;top:70px;z-index:60;width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#a11y[hidden]{display:none}
#a11y h2{font-size:1.05rem;margin:0 0 2px;letter-spacing:0}
#a11y .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
#a11y select{background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;font-size:.82rem;max-width:150px}
kbd{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:0 5px}
</style>

  else if(c==="work"){pr(bl(CASES.map(function(x){return x.tab[L]+": "+x.title[L]+(x.status?" ("+x.status[L]+")":"")})));pr(es?"Prueba: chatbot, planselect, qa-bot":"Try: chatbot, planselect, qa-bot","m")}
  else if(c==="chatbot"||c==="planselect"||c==="qa-bot"){var id=c==="qa-bot"?"qa":c,cs=CASES.filter(function(x){return x.id===id})[0];pr(cs.title[L],"h");if(cs.status)pr(cs.status[L],"m");pr(bl(cs.b[L]));if(id==="qa")pr((es?"En tickets complejos: costo ~40 % menor, ~35 % menos pasos y casi la mitad del tiempo.":"On complex tickets: ~40% lower cost, ~35% fewer steps and almost half the time."),"m");pr("Stack: "+cs.s.join(", "))}
  else if(c==="stack"){pr(GROUPS.map(function(g){return g[0]+": "+g[1].join(", ")}).join("\n"))}
  else if(c==="career"){pr(JOBS.slice().reverse().map(function(j){return j.p[L]+"  "+j.role[L]+" · "+j.co}).join("\n"))}
  else if(c==="looking-for"||c==="hire"){pr(es?"Cargos de Full Stack o Backend Developer, en Colombia o en remoto internacional. Inglés B1, en formación.":"Full Stack or Backend Developer roles, in Colombia or remote internationally. English level: B1, still studying.")}
  else if(c==="contact"){pr("LinkedIn: https://www.linkedin.com/in/juanpablocaicedo\nGitHub:   https://github.com/jpcaicedok")}
  else if(low==="sudo hire juan"||low==="sudo hire"){pr(es?"Permiso concedido. Escríbeme por LinkedIn y seguimos desde ahí.":"Permission granted. Message me on LinkedIn and let's take it from there.","m")}
  else if(c==="play"){play();pr(es?"Bach × 130 BPM. Usa stop para parar.":"Bach × 130 BPM. Use stop to end.","m")}
  else if(c==="stop"){stop();pr(es?"Música detenida.":"Music stopped.")}
  else if(c==="ride"){var n=(curJob+1)%JOBS.length;setJob(n);pr((es?"Parada: ":"Stop: ")+JOBS[n].short+" ("+JOBS[n].y+")","m");var rd=$("#career").getBoundingClientRect();pr(es?"Mira la sección Trayectoria.":"Check the Career section.")}
  else if(c==="lang"){if(a[1]==="es"||a[1]==="en"){setLang(a[1]);pr("OK")}else pr("lang es | lang en")}
  else if(c==="clear"){out.innerHTML=""}
  else if(c==="rm"||c==="sudo"){pr(es?"Mejor no. Prueba help.":"Better not. Try help.","m")}
  else pr(t("termNo")+q,"h");
}
$("#tform").addEventListener("submit",function(e){e.preventDefault();var i=$("#tin");runCmd(i.value);i.value=""});
$("#tin").addEventListener("keydown",function(e){var i=e.target;
  if(e.key==="ArrowUp"){e.preventDefault();if(hi>0){hi--;i.value=HIST[hi]}}
  if(e.key==="ArrowDown"){e.preventDefault();if(hi<HIST.length-1){hi++;i.value=HIST[hi]}else{hi=HIST.length;i.value=""}}
  if(e.key==="Tab"&&i.value){var m=CMDS.filter(function(c){return c.indexOf(i.value)===0});if(m.length===1){e.preventDefault();i.value=m[0]}}
});

/* a11y + lang */
function setLang(l){L=l;store.set("lang",l);var o=out.childElementCount;renderStatic();if(!o)pr(t("termHello"))}
$("#langBtn").addEventListener("click",function(){setLang(L==="es"?"en":"es")});
var fs=100;$("#fsUp").addEventListener("click",function(){fs=Math.min(150,fs+10);root.style.fontSize=fs+"%"});$("#fsDown").addEventListener("click",function(){fs=Math.max(90,fs-10);root.style.fontSize=fs+"%"});
$("#oTheme").addEventListener("change",function(e){root.dataset.theme=e.target.value;drawOnce()});
$("#oContrast").addEventListener("change",function(e){root.dataset.contrast=e.target.checked?"high":"";drawOnce()});
$("#oMotion").addEventListener("change",function(e){root.dataset.motion=e.target.checked?"off":"";if(e.target.checked){running=false;drawOnce()}else startViz()});
$("#oCb").addEventListener("change",function(e){document.body.style.filter=e.target.value==="none"?"":"url(#"+e.target.value+")"});
$("#readBtn").addEventListener("click",function(){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance("Juan Pablo Caicedo. "+t("lead")+" "+t("lead2"));u.lang=L==="es"?"es-ES":"en-US";speechSynthesis.speak(u)});
function togA(o){var p=$("#a11y"),b=$("#a11yBtn"),s=o===undefined?p.hidden:o;p.hidden=!s;b.setAttribute("aria-expanded",s);if(s)$("#fsDown").focus()}
$("#a11yBtn").addEventListener("click",function(){togA()});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(!$("#a11y").hidden){togA(false);$("#a11yBtn").focus()}return}
  var tg=e.target.tagName;if(tg==="INPUT"||tg==="SELECT"||e.metaKey||e.ctrlKey||e.altKey)return;
  var off=$("#off").getBoundingClientRect(),inOff=off.top<innerHeight&&off.bottom>0;
  var map={"1":"#work","2":"#stack","3":"#career","4":"#terminal","5":"#off"};
  if(map[e.key]){e.preventDefault();$(map[e.key]).scrollIntoView();return}
  if(inOff)return;
  if(e.key.toLowerCase()==="t"){e.preventDefault();$("#terminal").scrollIntoView();$("#tin").focus({preventScroll:true})}
  if(e.key.toLowerCase()==="m")toggle();
});

if(reduced())drawOnce();else startViz();
